<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>ライフログα</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 上：店舗・タグ / 中：選択内容・金額・決定 / 下：テンキー */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --fg:#1d2624; --muted:#66746f;
  --line:#d9e0dd; --accent:#1f6f5c; --accent-fg:#ffffff; --tag:#8a5a12; --tag-bg:#fbf1e1;
  --c-super:#e3f3e4; --c-conv:#fbf3cf; --c-food:#fde6d8; --c-amzn:#eadccb; --c-media:#dcf0fa; --c-life:#ecebe6; --c-tech:#ece3f7; --c-pink:#f9e1ec;
  --total-bg:#3a4a45; --chart:#1f6f5c; --engel:#d9822b; --marx:#5b5bd6;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#1b2320; --fg:#e6ece9; --muted:#93a39d;
  --line:#2c3733; --accent:#4fb497; --accent-fg:#0d1513; --tag:#e9b867; --tag-bg:#2a2217; --c-super:#1d3322; --c-conv:#353017; --c-food:#3a2619; --c-amzn:#3a2c1d; --c-media:#16303c; --c-life:#2b2a27; --c-tech:#2c2140; --c-pink:#3a1f2c; --total-bg:#25302c; --chart:#4fb497; --engel:#f0a35c; --marx:#a3a3f5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1b2320; --fg:#e6ece9; --muted:#93a39d;
  --line:#2c3733; --accent:#4fb497; --accent-fg:#0d1513; --tag:#e9b867; --tag-bg:#2a2217; --c-super:#1d3322; --c-conv:#353017; --c-food:#3a2619; --c-amzn:#3a2c1d; --c-media:#16303c; --c-life:#2b2a27; --c-tech:#2c2140; --c-pink:#3a1f2c; --total-bg:#25302c; --chart:#4fb497; --engel:#f0a35c; --marx:#a3a3f5; color-scheme:dark}
/* 食べログ：ダークモードでも薄いオレンジの明るい画面（ダーク指定より後ろに置いて上書き） */
:root.food{--bg:#fdebd6; --surface:#fff8f0; --fg:#3a2a1c; --muted:#8f7560; --line:#efd2b3;
  --accent:#c4621d; --accent-fg:#ffffff; --tag:#9a5a12; --tag-bg:#fff3e2; --c-food:#f8cfae; --c-pink:#f9dbe6; --c-media:#dcefff;
  --c-super:#e1f1df; --c-conv:#fbf0c4; --c-amzn:#ead8c4; --c-life:#eee6dc; --c-tech:#ebe0f5; color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-tap-highlight-color:transparent;overflow:hidden;-webkit-user-select:none;user-select:none}
button{touch-action:manipulation}
.app{height:100%;display:flex;flex-direction:column;gap:7px;max-width:520px;margin:0 auto;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box}
/* 店舗・タグ：2段の横スクロール */
.stores,.tags{flex:none;display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;gap:5px;overflow-x:auto;scrollbar-width:none}
.stores::-webkit-scrollbar,.tags::-webkit-scrollbar{display:none}
.chip{border:1px solid transparent;background:var(--surface);color:var(--fg);border-radius:7px;padding:6px 9px;font:500 12.5px var(--sans);white-space:nowrap;-webkit-touch-callout:none}
.tags .chip{color:var(--tag);font-size:12px}
/* 色（店舗・タグ共通） */
.chip[data-c="super"]{background:var(--c-super)}
.chip[data-c="conv"]{background:var(--c-conv)}
.chip[data-c="food"]{background:var(--c-food)}
.chip[data-c="amzn"]{background:var(--c-amzn)}
.chip[data-c="media"]{background:var(--c-media)}
.chip[data-c="life"]{background:var(--c-life)}
.chip[data-c="tech"]{background:var(--c-tech)}
.chip[data-c="pink"]{background:var(--c-pink)}
.chip[data-c="beige"]{background:var(--tag-bg)}
.chip[data-c="free"]{background:var(--surface);border:1px dashed var(--muted)}
.stores .chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.tags .chip[aria-pressed="true"]{background:var(--tag);border-color:var(--tag);color:var(--bg)}
.chip.plus{background:none;border:1px dashed var(--muted);color:var(--muted);font-weight:700;padding:6px 14px}
.chip.moving{outline:2px solid var(--accent);outline-offset:1px}
.move-mode .chip:not(.moving):not(.plus){outline:1px dashed var(--accent);outline-offset:-1px}
/* 長押しメニュー・編集シート */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;box-sizing:border-box;background:var(--surface);border-radius:16px 16px 0 0;display:flex;flex-direction:column;gap:10px;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h3{margin:0;font-size:15px}
.sheet .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sheet button.act{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;font:700 15px var(--sans);padding:12px 0}
.sheet button.act.danger{color:#c0392b}
.sheet button.act.main{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.sheet button.act.wide{grid-column:1/-1}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.swatches button{height:40px;border-radius:9px;border:1px solid var(--line);font:500 11px var(--sans);color:var(--fg)}
.swatches button[aria-pressed="true"]{outline:3px solid var(--fg);outline-offset:1px}
.sheet input{font:500 16px var(--sans);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;-webkit-user-select:text;user-select:text}
.move-bar{position:fixed;left:0;right:0;top:0;z-index:30;background:var(--accent);color:var(--accent-fg);display:flex;justify-content:space-between;align-items:center;font:700 13px var(--sans);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.move-bar button{background:none;border:1px solid currentColor;color:inherit;border-radius:7px;font:700 12px var(--sans);padding:4px 10px}
/* 中央：縮まない */
.center{flex:none;display:flex;flex-direction:column;gap:4px;
  --fg:#1d2624;--bg:#eef1f0;--muted:#66746f;--line:#d9e0dd;--accent:#1f6f5c;--accent-fg:#ffffff;--tag:#8a5a12;color-scheme:light;
  background:#ffffff;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.picked{display:flex;gap:6px;font-size:12.5px;font-weight:700;min-height:20px;overflow:hidden;white-space:nowrap}
.picked span{padding:1px 7px;border-radius:5px;background:var(--bg);overflow:hidden;text-overflow:ellipsis}
.memo-in{width:100%;box-sizing:border-box;font:500 16px var(--sans);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;-webkit-user-select:text;user-select:text}
.memo-in:focus{outline:2px solid var(--tag);outline-offset:0}
td small{display:block;font-size:11px;color:var(--muted)}
td[data-f]{cursor:pointer}
td.fixed-day{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--tag)}
tr.month td{background:var(--bg);font:700 11px var(--sans);color:var(--muted);letter-spacing:.06em;padding:5px 12px}
.cell-in{width:100%;min-width:0;box-sizing:border-box;font:500 16px var(--sans);color:var(--fg);background:var(--bg);border:1px solid var(--accent);border-radius:6px;padding:4px 6px;-webkit-user-select:text;user-select:text}
.cell-in+.cell-in{margin-top:4px}
td.editing{padding:4px}
.picked .ph{color:var(--muted);font-weight:500;background:none;padding:1px 0}
.row{display:flex;align-items:center;gap:10px}
.amount{flex:1;min-width:0;font:600 30px var(--mono);font-variant-numeric:tabular-nums;text-align:right;overflow:hidden;white-space:nowrap}
.amtbox{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-end}
.calc{font:500 11px var(--mono);color:var(--muted);min-height:14px;font-variant-numeric:tabular-nums}
.amount small{font-size:.5em;color:var(--muted);margin-right:4px}
.ok{flex:none;background:var(--accent);color:var(--accent-fg);border:none;border-radius:10px;font:700 16px var(--sans);padding:11px 18px}
.ok:disabled{opacity:.35}
/* テンキー：残りの高さを使う */
.keys{flex:1;min-height:150px;display:grid;grid-template-columns:.85fr repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:5px}
.keys button{border:none;background:var(--surface);color:var(--fg);border-radius:9px;font:600 22px var(--mono);box-shadow:0 1px 0 var(--line);min-height:0}
.keys .add{background:var(--tag-bg);color:var(--tag);font:600 15px var(--mono)}
.keys .add::before{content:"+";opacity:.6;margin-right:1px}
.keys button:active,.chip:active{transform:scale(.97)}
.keys .fn{font:700 15px var(--sans);color:var(--muted)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 最上部：累計＋切替 */
.top{display:flex;gap:8px;align-items:stretch}
.top{flex:none}
.total{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto;align-items:baseline;column-gap:8px;row-gap:1px;border:none;border-radius:10px;
  background:var(--total-bg);color:#ffffff;padding:7px 12px;font-family:var(--sans);text-align:left}
.total span{font-size:11px;white-space:nowrap;letter-spacing:.06em;color:#c3d0cb}
.total b{font:600 20px var(--mono);font-variant-numeric:tabular-nums}
.total .split{grid-column:1/-1;display:flex;justify-content:flex-end;gap:12px;font:500 11px var(--mono);font-variant-numeric:tabular-nums;color:#c3d0cb}
.total .split i{font-style:normal;font-family:var(--sans);margin-right:4px}
.total .split .e i{color:#f6b77a}.total .split .m i{color:#b9b9fa}
.switch{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;font:700 14px var(--sans);padding:0 14px}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
#inputView,#foodInput{gap:7px}
/* 最上段：銭ログ／食べログ */
.modebar{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;border-radius:9px;background:var(--line)}
.modebar button{border:none;border-radius:7px;background:none;color:var(--muted);font:700 12px var(--sans);padding:4px 0;letter-spacing:.08em}
.modebar button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.fdate{flex:1;display:flex;align-items:center;min-height:40px;font:700 15px var(--sans);padding:0 4px}
/* 食べログ */
.center.fcenter{flex-direction:row;align-items:center;gap:10px;padding:10px;cursor:text}
:root.food .center{--accent:#c4621d;--fg:#3a2a1c;--bg:#fdebd6;--muted:#8f7560;--line:#efd2b3}
.fleft{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fleft #fpicked{display:contents}
.fnote{flex:1;min-width:6em;border:none;outline:none;background:none;color:var(--fg);font:500 16px var(--sans);padding:4px 2px;-webkit-user-select:text;user-select:text}
.fnote::placeholder{color:var(--muted)}
.flog .row small,#ftbody td small{display:block;font-size:11px;color:var(--muted)}
.fcenter .picked{flex:1;flex-wrap:wrap;white-space:normal;min-height:24px}
.flog{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.flog h4{margin:0 0 4px;font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--muted)}
.flog .row{display:flex;gap:10px;align-items:baseline;padding:7px 2px;border-bottom:1px solid var(--line);font-size:13px}
.flog .row time{font:500 12px var(--mono);color:var(--muted)}
.flog .row em{font-style:normal;font-size:11px;color:var(--tag);margin-left:auto;white-space:nowrap}
/* 表 */
.tblwrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.06em;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th:first-child,td:first-child{padding-left:12px;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums}
td:nth-child(3){color:var(--tag);font-size:12px;min-width:5.5em;word-break:keep-all}
.num{text-align:right;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.chartwrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px 6px}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.chart-head b{font-size:13px}
.chartwrap{gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:none;color:var(--muted);font:700 12px var(--sans);padding:5px 12px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.series{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.series button{display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:5px;text-align:left;border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;padding:5px 7px;font:700 11px var(--sans)}
.series button i{width:9px;height:9px;border-radius:50%;border:2px solid currentColor;box-sizing:border-box}
.series button b{grid-column:1/-1;font:600 14px var(--mono);font-variant-numeric:tabular-nums;color:var(--fg)}
.series [data-s="total"]{--sc:var(--chart)}.series [data-s="engel"]{--sc:var(--engel)}.series [data-s="marx"]{--sc:var(--marx)}
.series button i{color:var(--sc)}
.series button[aria-pressed="true"]{border-color:var(--sc);color:var(--fg)}
.series button[aria-pressed="true"] i{background:var(--sc)}
.series button[aria-pressed="false"] b{color:var(--muted)}
#chart{flex:1;min-height:0;width:100%}
#chart text{fill:var(--muted);font:10px var(--mono)}
#chart .grid{stroke:var(--line);stroke-width:1}
#chart .ln{fill:none;stroke-width:2.5;stroke-linejoin:round}
#chart .area{fill:var(--chart);opacity:.12}

#chart .endlabel{fill:var(--fg);font:600 11px var(--mono)}
.empty{color:var(--muted);text-align:center;padding:24px}
.del{border:none;background:none;color:var(--muted);font:14px var(--sans);padding:4px 8px}
.del.c{color:var(--tag);font-size:12px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;z-index:30}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <div class="modebar" id="modebar"><button data-mode="kakei" aria-pressed="true">銭ログ</button><button data-mode="food" aria-pressed="false">食べログ</button></div>
  <div class="top">
    <div class="fdate" id="fdate" hidden></div>
    <button class="total" id="total"><span id="tLabel"></span><b id="tVal"></b><span class="split"><span class="e"><i>エンゲル</i><span id="tEngel"></span></span><span class="m"><i>マルクス</i><span id="tMarx"></span></span></span></button>
    <button class="switch" id="switch">表</button>
  </div>

  <div class="view" id="inputView">
    <div class="stores" id="stores"></div>
    <div class="tags" id="tags"></div>

    <div class="center">
      <div class="picked" id="picked"></div>
      <input class="memo-in" id="storeName" type="text" placeholder="店舗名を入力" autocomplete="off" hidden>
      <input class="memo-in" id="memo" type="text" placeholder="品名" autocomplete="off" hidden>
      <div class="row">
        <div class="amtbox"><div class="calc" id="calc"></div><div class="amount" id="amount"><small>¥</small>0</div></div>
        <button class="ok" id="ok" disabled>決定</button>
      </div>
    </div>

    <div class="keys" id="keys"></div>
  </div>

  <div class="view tblwrap" id="tableView" hidden>
    <table>
      <thead><tr><th>月日</th><th>店舗</th><th>タグ</th><th class="num">金額</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="view" id="foodInput" hidden>
    <div class="stores" id="foods"></div>
    <div class="tags" id="ftags"></div>
    <div class="center fcenter">
      <div class="fleft" id="fleft"><div class="picked" id="fpicked"></div><input class="fnote" id="fnote" type="text" placeholder="メモ" autocomplete="off"></div>
      <button class="ok" id="fok" disabled>決定</button>
    </div>
    <div class="flog"><h4>今日の記録</h4><div id="ftoday"></div></div>
  </div>

  <div class="view tblwrap" id="foodTable" hidden>
    <table>
      <thead><tr><th>日付</th><th>食べたもの</th><th>タグ</th><th></th></tr></thead>
      <tbody id="ftbody"></tbody>
    </table>
  </div>

  <div class="view chartwrap" id="chartView" hidden>
    <div class="chart-head"><b id="chartTitle"></b>
      <div class="seg" id="chartMode"><button data-m="line" aria-pressed="true">累積</button><button data-m="bar" aria-pressed="false">日毎</button></div></div>
    <div class="series" id="series">
      <button data-s="total" aria-pressed="true"><i></i>累計<b></b></button>
      <button data-s="engel" aria-pressed="false"><i></i>エンゲル<b></b></button>
      <button data-s="marx" aria-pressed="false"><i></i>マルクス<b></b></button>
    </div>
    <svg id="chart" role="img" aria-label="今月の累計の推移"></svg>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="move-bar" id="moveBar" hidden><span>移動先のボタンをタップ</span><button id="moveCancel">やめる</button></div>
<div class="sheet-bg" id="sheetBg" hidden><div class="sheet" id="sheet"></div></div>

<script>
const STORE_FREE="記入";
const STORE_GROUPS=[
  ["free",[STORE_FREE]],
  ["super",["サンディ","阪急オアシス","まるとく","イズミヤ","業務スーパー","シェフカワカミ","イオンタウン","スギ薬局","ジャパン","ドンキホーテ"]],
  ["conv",["ファミリーマート","自動販売機"]],
  ["food",["マクドナルド","なか卯","カフェ・ド・クリエ","モスバーガー"]],
  ["amzn",["Amazon通販"]],
  ["media",["Amazon Downloads","ブックオフ"]],
  ["life",["メルカリ"]],
  ["tech",["アンソロピック","オープンAI","Microsoft","Google","Apple","J-Quants API","IIJ"]],
];
const CAT=Object.fromEntries(STORE_GROUPS.flatMap(([c,l])=>l.map(n=>[n,c])));
const MEMO="記入";
/* 店舗・タグの並びと色（ブラウザに保存。消しても記録は消えない） */
const COLORS=[["super","緑"],["conv","黄"],["food","橙"],["amzn","茶"],["media","水色"],["life","灰"],["tech","紫"],["pink","桃"],["beige","肌"],["free","白"]];
const CFG_KEY="kakeibo.config.v1";
const defaultCfg=()=>({
  stores:STORE_GROUPS.flatMap(([c,l])=>l.map(name=>({name,c}))),
  tags:["外食","食品","コンテンツ",MEMO,"非日常気晴らし","非日常必要","必要経費","固定"].map(name=>({name,c:name===MEMO?"free":"beige"}))});
let cfg=(()=>{try{const c=JSON.parse(localStorage.getItem(CFG_KEY));if(c&&c.stores&&c.tags)return c}catch(e){}return defaultCfg()})();
const FOOD_DEFAULT=["サンディ","阪急オアシス","まるとく","イズミヤ","業務スーパー","シェフカワカミ","イオンタウン"];
if(!cfg.v){ // 初回だけ：記入・スーパーに印を付ける
  cfg.stores.forEach(x=>{if(x.name===STORE_FREE)x.free=true;if(FOOD_DEFAULT.includes(x.name))x.food=true});
  cfg.tags.forEach(x=>{if(x.name===MEMO)x.memo=true});cfg.v=2;

function env(g,t,peak,dur){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+0.004);g.gain.exponentialRampToValueAtTime(0.0001,t+dur)}
function noise(c,dur){const b=c.createBuffer(1,Math.ceil(c.sampleRate*dur),c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;return s}
const SE={
  /* 低音バシッ：低いサイン波の急降下＋こもったノイズ */
  bash(){const c=actx();if(!c)return;const t=c.currentTime;
    const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+0.14);
    env(g,t,0.9,0.18);o.connect(g).connect(c.destination);o.start(t);o.stop(t+0.2);
    const n=noise(c,0.08),f=c.createBiquadFilter(),ng=c.createGain();f.type="lowpass";f.frequency.value=900;
    env(ng,t,0.5,0.07);n.connect(f).connect(ng).connect(c.destination);n.start(t)},
  /* 決定音：低音の「ブチュ」（短く湿った音） */
  ok(){const c=actx();if(!c)return;const t=c.currentTime;
    const o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();o.type="triangle";
    o.frequency.setValueAtTime(260,t);o.frequency.exponentialRampToValueAtTime(65,t+0.09);
    f.type="lowpass";f.frequency.setValueAtTime(1400,t);f.frequency.exponentialRampToValueAtTime(250,t+0.09);f.Q.value=6;
    env(g,t,0.35,0.11);o.connect(f).connect(g).connect(c.destination);o.start(t);o.stop(t+0.13)},
  /* カリカリ：ごく短い高音ノイズ */
  tick(){const c=actx();if(!c||c.state!=="running")return;const t=c.currentTime;
    const n=noise(c,0.012),f=c.createBiquadFilter(),g=c.createGain();f.type="highpass";f.frequency.value=3500;
    env(g,t,0.35,0.012);n.connect(f).connect(g).connect(c.destination);n.start(t)},
  /* クリック音 */
  click(){const c=actx();if(!c)return;const t=c.currentTime;
    const n=noise(c,0.03),f=c.createBiquadFilter(),g=c.createGain();f.type="bandpass";f.frequency.value=2200;f.Q.value=1.2;
    env(g,t,0.8,0.03);n.connect(f).connect(g).connect(c.destination);n.start(t);
    const o=c.createOscillator(),og=c.createGain();o.type="triangle";o.frequency.value=1700;env(og,t,0.25,0.025);o.connect(og).connect(c.destination);o.start(t);o.stop(t+0.04)}
};

}

/* 移動：選んだボタンを、タップしたボタンの位置へ */
function moveTo(kind,target){
  const list=listOf(kind),from=list.findIndex(x=>x.name===moving.name),to=list.findIndex(x=>x.name===target);
  if(from>=0&&to>=0&&from!==to){const [it]=list.splice(from,1);list.splice(to,0,it);LISTS[kind].save()}
  endMove()}
function endMove(){moving=null;$("moveBar").hidden=true;renderChips()}
$("moveCancel").onclick=endMove;
function render(){
  document.querySelectorAll("#stores .chip[data-name]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.name===store));
  document.querySelectorAll("#tags .chip[data-name]").forEach(b=>b.setAttribute("aria-pressed",tags.has(b.dataset.name)));
  $("memo").hidden=!(memoOpen||tags.has(memoName())||$("memo").value);
  $("storeName").hidden=!isFree(store);
  $("picked").innerHTML=(storeName()?`<span>${esc(storeName())}</span>`:`<span class="ph">店舗を選択</span>`)+(tagList().length?tagList().map(t=>`<span>${t}</span>`).join(""):`<span class="ph">タグなし</span>`);
  $("amount").innerHTML=`<small>¥</small>${yen(total())}`;
  $("calc").textContent=(base&&typed)?`${yen(base)} ＋ ${yen(Number(typed))}`:"";
  $("ok").disabled=!(storeName()&&total()>0);
  renderTotal();
}
/* 累計：タップで 今月→本日→今週→月前半→月後半 */
let mode=0;
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function range(){
  const n=new Date(), y=n.getFullYear(), m=n.getMonth(), M=m+1;
  const last=new Date(y,m+1,0).getDate();
  const ws=new Date(y,m,n.getDate()-n.getDay()), we=new Date(ws);we.setDate(ws.getDate()+6);
  const md=d=>`${d.getMonth()+1}/${d.getDate()}`;
  return [
    {label:`今月（${M}月）`,from:dkey(new Date(y,m,1)),to:dkey(new Date(y,m,last))},
    {label:`本日（${M}/${n.getDate()}）`,from:dkey(n),to:dkey(n)},
    {label:`今週（${md(ws)}〜${md(we)}）`,from:dkey(ws),to:dkey(we)},
    {label:`月前半（${M}/1〜15）`,from:dkey(new Date(y,m,1)),to:dkey(new Date(y,m,15))},
    {label:`月後半（${M}/16〜${last}）`,from:dkey(new Date(y,m,16)),to:dkey(new Date(y,m,last))},
  ][mode];
}
function renderTotal(){
  const r=range(), list=load().filter(x=>{const d=x.date.slice(0,10);return d>=r.from&&d<=r.to});
  const sum=list.reduce((a,x)=>a+x.amount,0), eng=list.filter(isEngel).reduce((a,x)=>a+x.amount,0);
  $("tLabel").textContent=r.label; $("tVal").textContent=`¥${yen(sum)}`;
  $("tEngel").textContent=`¥${yen(eng)}`; $("tMarx").textContent=`¥${yen(sum-eng)}`;
}
$("total").onclick=()=>{mode=(mode+1)%5;renderTotal()};
/* 左端：加算ボタン ／ 右：数字キー */
["+100","7","8","9","+500","4","5","6","+1000","1","2","3","+5000","C","0","⌫"].forEach(k=>{
  const b=document.createElement("button");
  if(k[0]==="+"){b.className="add";b.textContent=yen(Number(k.slice(1)));}
  else{b.textContent=k;if(k==="C"||k==="⌫")b.className="fn";}
  b.onclick=()=>{
    if(k[0]==="+"){SE.bash();base+=Number(k.slice(1));}
    else if(k==="C"){base=0;typed="";}
    else if(k==="⌫")typed=typed.slice(0,-1);
    else if(typed.length<7&&!(typed===""&&k==="0"))typed+=k;
    render()};
  $("keys").appendChild(b)});

$("ok").onclick=()=>{
  SE.ok();
  const d=new Date();
  const date=`${dkey(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const r=load();const memo=$("memo").hidden?"":$("memo").value.trim();
  r.unshift({id:Date.now(),date,store:storeName(),tags:tagList(),memo,amount:total()});save(r);
  toast(`${storeName()} ¥${yen(total())} を記録`);
  store=null;tags=new Set();autoAdded=new Set();memoOpen=false;$("memo").value="";$("memo").blur();$("storeName").value="";$("storeName").blur();base=0;typed="";render();
};
function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,1600)}
/* 表表示：古い順。各月の「固定」は1日より前に並べる。セルを押すと編集 */
const sortKey=x=>isFixed(x)?x.date.slice(0,8)+"00":x.date;
function renderTable(){
  const r=load().sort((a,b)=>sortKey(a)<sortKey(b)?-1:sortKey(a)>sortKey(b)?1:a.id-b.id),tb=$("tbody");tb.innerHTML="";
  if(!r.length){tb.innerHTML='<tr><td colspan="5" class="empty">まだ記録はありません</td></tr>';return}
  let month="";
  r.forEach(x=>{
    const [yy,mm,dd]=x.date.slice(0,10).split("-");
    if(yy+mm!==month){month=yy+mm;const h=document.createElement("tr");h.className="month";h.innerHTML=`<td colspan="5">${yy}年${Number(mm)}月</td>`;tb.appendChild(h)}
    const tr=document.createElement("tr");
    tr.innerHTML=`<td data-f="date"${isFixed(x)?' class="fixed-day"':""}>${isFixed(x)?"固定":`${Number(mm)}/${Number(dd)}`}</td>`+
      `<td data-f="store">${esc(x.store)}${x.memo?`<small>${esc(x.memo)}</small>`:""}</td>`+
      `<td data-f="tags">${esc(tagsOf(x).join("・"))}</td><td data-f="amount" class="num">¥${yen(x.amount)}</td><td></td>`;
    tr.querySelectorAll("td[data-f]").forEach(td=>td.onclick=()=>editCell(td,x));
    const b=document.createElement("button");b.className="del";b.textContent="×";b.setAttribute("aria-label","削除");
    b.onclick=()=>{if(b.classList.contains("c")){save(load().filter(y=>y.id!==x.id));renderTable();renderTotal()}else{b.classList.add("c");b.textContent="削除"}};
    tr.lastChild.appendChild(b);tb.appendChild(tr)});
}
/* セル編集：欄の外に出るか Enter で保存、Esc で取り消し */
function editCell(td,x){
  if(td.classList.contains("editing"))return;
  const f=td.dataset.f;td.classList.add("editing");
  const mk=(val,ph,type="text",mode)=>{const i=document.createElement("input");i.className="cell-in";i.type=type;i.value=val;i.placeholder=ph;if(mode)i.inputMode=mode;return i};
  let ins=[];
  if(f==="date")ins=[mk(x.date.slice(0,10),"","date")];
  if(f==="store")ins=[mk(x.store,"店舗名"),mk(x.memo||"","品名")];
  if(f==="tags")ins=[mk(tagsOf(x).join("・"),"例：食品・外食")];
  if(f==="amount")ins=[mk(String(x.amount),"金額","text","numeric")];
  td.innerHTML="";ins.forEach(i=>td.appendChild(i));ins[0].focus();
  let done=false;
  const finish=ok=>{if(done)return;done=true;
    if(ok){const r=load(),y=r.find(z=>z.id===x.id);if(y){
      if(f==="date"&&/^\d{4}-\d{2}-\d{2}$/.test(ins[0].value))y.date=ins[0].value+x.date.slice(10);
      if(f==="store"&&ins[0].value.trim()){y.store=ins[0].value.trim();y.memo=ins[1].value.trim();}
      if(f==="tags"){y.tags=ins[0].value.split(/[・,、\s]+/).map(t=>t.trim()).filter(Boolean);delete y.tag;}
      if(f==="amount"){const v=Number(ins[0].value.replace(/[^0-9]/g,""));if(v>0)y.amount=v;}
      save(r);}}
    renderTable();renderTotal()};
  td.addEventListener("focusout",e=>{if(!td.contains(e.relatedTarget))finish(true)});
  ins.forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();finish(true)}if(e.key==="Escape")finish(false)}));
}
/* 画面切替：入力 → 表 → グラフ → 入力（ボタンには次の画面名を表示） */
const VIEWS={kakei:[["inputView","表"],["tableView","グラフ"],["chartView","入力"]],food:[["foodInput","表"],["foodTable","入力"]]};
const ALL_VIEWS=["inputView","tableView","chartView","foodInput","foodTable"];
let appMode="kakei", view=0;
function showView(){
  document.documentElement.classList.toggle("food",appMode==="food");
  const vs=VIEWS[appMode],id=vs[view][0];
  ALL_VIEWS.forEach(v=>$(v).hidden=v!==id);
  $("switch").textContent=vs[view][1];
  $("total").hidden=appMode!=="kakei"; $("fdate").hidden=appMode!=="food";
  $("modebar").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===appMode));
  if(id==="tableView"){renderTable();const w=$("tableView");w.scrollTop=w.scrollHeight;}
  if(id==="chartView")renderChart();
  if(id==="foodTable"){renderFoodTable();const w=$("foodTable");w.scrollTop=w.scrollHeight;}
  if(id==="foodInput")renderFood();
}
$("switch").onclick=()=>{view=(view+1)%VIEWS[appMode].length;showView()};
/* 銭ログ／食べログの切替（どちらを開いていたかはこの端末に記憶） */
$("modebar").querySelectorAll("button").forEach(b=>b.onclick=()=>{
  if(moving)endMove();appMode=b.dataset.mode;view=0;try{localStorage.setItem("kakeibo.mode",appMode)}catch(e){};showView()});
try{if(localStorage.getItem("kakeibo.mode")==="food")appMode="food"}catch(e){}
/* 今月のグラフ：累計／エンゲル／マルクスを重ねて表示。累積折れ線 ⇔ 日毎の棒 */
const SERIES={total:"var(--chart)",engel:"var(--engel)",marx:"var(--marx)"};
let chartSel=new Set(["total"]), chartMode="line";
$("series").querySelectorAll("button").forEach(b=>b.onclick=()=>{const k=b.dataset.s;
  if(chartSel.has(k)){if(chartSel.size>1)chartSel.delete(k)}else chartSel.add(k);renderChart()});
$("chartMode").querySelectorAll("button").forEach(b=>b.onclick=()=>{chartMode=b.dataset.m;renderChart()});
function renderChart(){
  const svg=$("chart"),W=svg.clientWidth||340,H=svg.clientHeight||300;
  const n=new Date(),y=n.getFullYear(),m=n.getMonth(),last=new Date(y,m+1,0).getDate(),today=n.getDate();
  const daily={total:Array(last+1).fill(0),engel:Array(last+1).fill(0),marx:Array(last+1).fill(0)};
  load().forEach(x=>{const d=x.date.slice(0,10).split("-").map(Number);if(d[0]!==y||d[1]!==m+1)return;
    const day=isFixed(x)?0:d[2];
    daily.total[day]+=x.amount;daily[isEngel(x)?"engel":"marx"][day]+=x.amount});
  const cum={};for(const k in daily){cum[k]=[daily[k][0]];for(let d=1;d<=last;d++)cum[k][d]=cum[k][d-1]+daily[k][d]}
  // 「今日」か「今月で記録がある最後の日」の遅いほうまで
  let end=today;for(let d=last;d>today;d--)if(daily.total[d]){end=d;break}
  $("chartTitle").textContent=`${m+1}月`;
  $("chartMode").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===chartMode));
  $("series").querySelectorAll("button").forEach(b=>{b.setAttribute("aria-pressed",chartSel.has(b.dataset.s));b.querySelector("b").textContent=`¥${yen(cum[b.dataset.s][last])}`});
  const sel=["total","engel","marx"].filter(k=>chartSel.has(k));
  const bar=chartMode==="bar";
  const max=bar?Math.max(0,...sel.flatMap(k=>daily[k])):Math.max(0,...sel.map(k=>cum[k][end]));
  // 目盛り：1,2,5系のきりのいい刻み
  const raw=Math.max(max,1000)/4,p10=10**Math.floor(Math.log10(raw)),step=[1,2,5,10].map(k=>k*p10).find(v=>v>=raw);
  const top=Math.ceil(Math.max(max,1)/step)*step;
  const L=44,R=10,T=10,B=22,pw=W-L-R,ph=H-T-B,Z=36,slot=(pw-Z)/last;
  const X=d=>d===0?L+Z/2-2:L+Z+(d-.5)*slot, Y=v=>T+ph-v/top*ph;
  let g="";
  for(let v=0;v<=top;v+=step){g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${v>=10000?(v/10000)+"万":yen(v)}</text>`}
  [1,8,15,22,last].forEach(d=>g+=`<text x="${X(d)}" y="${H-6}" text-anchor="middle">${d}日</text>`);
  g+=`<text x="${X(0)}" y="${H-6}" text-anchor="middle">固定</text><line class="grid" x1="${L+Z-2}" x2="${L+Z-2}" y1="${T}" y2="${T+ph}"/>`;
  if(end>today||bar)g+=`<line class="grid" x1="${X(today)}" x2="${X(today)}" y1="${T}" y2="${T+ph}" stroke-dasharray="3 3"/><text x="${X(today)+4}" y="${T+8}" text-anchor="start">今日</text>`;
  if(bar){
    // 棒：累計は薄い帯、エンゲル→マルクスの順に下から積む（両方で累計と同じ高さ）
    const w=Math.max(2,slot*.7),w0=Math.min(18,Z*.5);
    for(let d=0;d<=last;d++){const ww=d===0?w0:w,x=X(d)-ww/2;
      if(chartSel.has("total")&&daily.total[d])g+=`<rect x="${x}" y="${Y(daily.total[d])}" width="${ww}" height="${Y(0)-Y(daily.total[d])}" fill="${SERIES.total}" opacity="${sel.length>1?.25:.85}" rx="1.5"/>`;
      let base=0;["engel","marx"].forEach(k=>{if(!chartSel.has(k)||!daily[k][d])return;
        g+=`<rect x="${x}" y="${Y(base+daily[k][d])}" width="${ww}" height="${Y(base)-Y(base+daily[k][d])}" fill="${SERIES[k]}" rx="1.5"/>`;base+=daily[k][d]})}
  }else{
    sel.forEach(k=>{const pts=[];for(let d=0;d<=end;d++)pts.push(`${X(d).toFixed(1)},${Y(cum[k][d]).toFixed(1)}`);
      if(sel.length===1)g+=`<polygon points="${X(0)},${Y(0)} ${pts.join(" ")} ${X(end)},${Y(0)}" fill="${SERIES[k]}" opacity=".12"/>`;
      g+=`<polyline class="ln" stroke="${SERIES[k]}" points="${pts.join(" ")}"/><circle cx="${X(end)}" cy="${Y(cum[k][end])}" r="3.5" fill="${SERIES[k]}"/>`});
  }
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.innerHTML=g;
}
renderChips();showView();
</script>
