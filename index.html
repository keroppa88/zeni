<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>ワンタップ家計簿</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 上：店舗・タグ / 中：選択内容・金額・決定 / 下：テンキー */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --fg:#1d2624; --muted:#66746f;
  --line:#d9e0dd; --accent:#1f6f5c; --accent-fg:#ffffff; --tag:#8a5a12; --tag-bg:#fbf1e1;
  --c-super:#e3f3e4; --c-conv:#fbf3cf; --c-food:#fde6d8; --c-amzn:#eadccb; --c-media:#dcf0fa; --c-life:#ecebe6; --c-tech:#ece3f7;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#1b2320; --fg:#e6ece9; --muted:#93a39d;
  --line:#2c3733; --accent:#4fb497; --accent-fg:#0d1513; --tag:#e9b867; --tag-bg:#2a2217; --c-super:#1d3322; --c-conv:#353017; --c-food:#3a2619; --c-amzn:#3a2c1d; --c-media:#16303c; --c-life:#2b2a27; --c-tech:#2c2140; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1b2320; --fg:#e6ece9; --muted:#93a39d;
  --line:#2c3733; --accent:#4fb497; --accent-fg:#0d1513; --tag:#e9b867; --tag-bg:#2a2217; --c-super:#1d3322; --c-conv:#353017; --c-food:#3a2619; --c-amzn:#3a2c1d; --c-media:#16303c; --c-life:#2b2a27; --c-tech:#2c2140; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-tap-highlight-color:transparent;overflow:hidden;-webkit-user-select:none;user-select:none}
button{touch-action:manipulation}
.app{height:100%;display:flex;flex-direction:column;gap:7px;max-width:520px;margin:0 auto;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box}
/* 店舗：2段の横スクロール */
.stores{flex:none;display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;gap:5px;overflow-x:auto;scrollbar-width:none}
.stores::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:7px;padding:6px 9px;font:500 12.5px var(--sans);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
/* 店舗の分野色 */
.stores .chip{border-color:transparent}
.stores .chip[data-c="super"]{background:var(--c-super)}
.stores .chip[data-c="conv"]{background:var(--c-conv)}
.stores .chip[data-c="food"]{background:var(--c-food)}
.stores .chip[data-c="amzn"]{background:var(--c-amzn)}
.stores .chip[data-c="media"]{background:var(--c-media)}
.stores .chip[data-c="life"]{background:var(--c-life)}
.stores .chip[data-c="tech"]{background:var(--c-tech)}
.stores .chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tags{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.tags .chip{text-align:center;color:var(--tag);background:var(--tag-bg);border-color:transparent;padding:6px 2px}
.tags .chip[aria-pressed="true"]{background:var(--tag);color:var(--bg)}
/* 中央：縮まない */
.center{flex:none;display:flex;flex-direction:column;gap:4px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.picked{display:flex;gap:6px;font-size:12.5px;font-weight:700;min-height:20px;overflow:hidden;white-space:nowrap}
.picked span{padding:1px 7px;border-radius:5px;background:var(--bg);overflow:hidden;text-overflow:ellipsis}
.picked .ph{color:var(--muted);font-weight:500;background:none;padding:1px 0}
.row{display:flex;align-items:center;gap:10px}
.amount{flex:1;min-width:0;font:600 30px var(--mono);font-variant-numeric:tabular-nums;text-align:right;overflow:hidden;white-space:nowrap}
.amtbox{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-end}
.calc{font:500 11px var(--mono);color:var(--muted);min-height:14px;font-variant-numeric:tabular-nums}
.amount small{font-size:.5em;color:var(--muted);margin-right:4px}
.ok{flex:none;background:var(--accent);color:var(--accent-fg);border:none;border-radius:10px;font:700 16px var(--sans);padding:11px 18px}
.ok:disabled{opacity:.35}
/* テンキー：残りの高さを使う */
.keys{flex:1;min-height:150px;display:grid;grid-template-columns:.85fr repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:5px}
.keys button{border:none;background:var(--surface);color:var(--fg);border-radius:9px;font:600 22px var(--mono);box-shadow:0 1px 0 var(--line);min-height:0}
.keys .add{background:var(--tag-bg);color:var(--tag);font:600 15px var(--mono)}
.keys .add::before{content:"+";opacity:.6;margin-right:1px}
.keys button:active,.chip:active{transform:scale(.97)}
.keys .fn{font:700 15px var(--sans);color:var(--muted)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 最上部：累計＋切替 */
.top{display:flex;gap:8px;align-items:stretch}
.top{flex:none}
.total{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px;border:none;border-radius:10px;
  background:var(--fg);color:var(--bg);padding:7px 12px;font-family:var(--sans);text-align:left}
.total span{font-size:11px;white-space:nowrap;letter-spacing:.06em;opacity:.75}
.total b{font:600 20px var(--mono);font-variant-numeric:tabular-nums}
.switch{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;font:700 14px var(--sans);padding:0 14px}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
/* 表 */
.tblwrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.06em;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th:first-child,td:first-child{padding-left:12px;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums}
td:nth-child(3){color:var(--tag);font-size:12px}
.num{text-align:right;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:24px}
.del{border:none;background:none;color:var(--muted);font:14px var(--sans);padding:4px 8px}
.del.c{color:var(--tag);font-size:12px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;z-index:30}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <button class="total" id="total"><span id="tLabel"></span><b id="tVal"></b></button>
    <button class="switch" id="switch">表</button>
  </div>

  <div class="view" id="inputView">
    <div class="stores" id="stores"></div>
    <div class="tags" id="tags"></div>

    <div class="center">
      <div class="picked" id="picked"></div>
      <div class="row">
        <div class="amtbox"><div class="calc" id="calc"></div><div class="amount" id="amount"><small>¥</small>0</div></div>
        <button class="ok" id="ok" disabled>決定</button>
      </div>
    </div>

    <div class="keys" id="keys"></div>
  </div>

  <div class="view tblwrap" id="tableView" hidden>
    <table>
      <thead><tr><th>月日</th><th>店舗</th><th>タグ</th><th class="num">金額</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const STORE_GROUPS=[
  ["super",["サンディ","阪急オアシス","KOHYO","イズミヤ","業務スーパー","シェフカワカミ","イオンタウン","スギ薬局","ジャパン","MEGAドン・キホーテ"]],
  ["conv",["ファミリーマート","自動販売機"]],
  ["food",["マクドナルド","なか卯","カフェ・ド・クリエ","バーガーキング","モスバーガー"]],
  ["amzn",["Amazon通販","Amazonプライム"]],
  ["media",["Amazon Downloads","ブックオフ"]],
  ["life",["ニトリ","メルカリ"]],
  ["tech",["Anthropic（Claude）","OpenAI（ChatGPT）","Microsoft","Google Cloud","Apple","J-Quants API","IIJ","転職会議"]],
];
const STORES=STORE_GROUPS.flatMap(g=>g[1]);
const CAT=Object.fromEntries(STORE_GROUPS.flatMap(([c,l])=>l.map(n=>[n,c])));
const TAGS=["外食","食品","コンテンツ","非日常気晴らし","非日常必要","必要経費"];
const KEY="kakeibo.records.v1";
let store=null, tag=null, base=0, typed="";
const total=()=>base+Number(typed||0);

const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return []}};
const save=r=>{try{localStorage.setItem(KEY,JSON.stringify(r))}catch(e){}};
const yen=n=>n.toLocaleString("ja-JP");
const $=id=>document.getElementById(id);

/* 効果音（Web Audio） */
let ac=null;
function actx(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();}catch(e){}return ac}
["touchstart","touchend","mousedown"].forEach(ev=>document.addEventListener(ev,actx,{passive:true}));
function env(g,t,peak,dur){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+0.004);g.gain.exponentialRampToValueAtTime(0.0001,t+dur)}
function noise(c,dur){const b=c.createBuffer(1,Math.ceil(c.sampleRate*dur),c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;return s}
const SE={
  /* 低音バシッ：低いサイン波の急降下＋こもったノイズ */
  bash(){const c=actx();if(!c)return;const t=c.currentTime;
    const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+0.14);
    env(g,t,0.9,0.18);o.connect(g).connect(c.destination);o.start(t);o.stop(t+0.2);
    const n=noise(c,0.08),f=c.createBiquadFilter(),ng=c.createGain();f.type="lowpass";f.frequency.value=900;
    env(ng,t,0.5,0.07);n.connect(f).connect(ng).connect(c.destination);n.start(t)},
  /* ファミコン的決定音：矩形波の2音 */
  ok(){const c=actx();if(!c)return;const t=c.currentTime;
    [[988,0,0.07],[1319,0.075,0.22]].forEach(([fr,st,du])=>{const o=c.createOscillator(),g=c.createGain();o.type="square";o.frequency.value=fr;
      g.gain.setValueAtTime(0.12,t+st);g.gain.setValueAtTime(0.12,t+st+du-0.02);g.gain.linearRampToValueAtTime(0,t+st+du);
      o.connect(g).connect(c.destination);o.start(t+st);o.stop(t+st+du)})},
  /* カリカリ：ごく短い高音ノイズ */
  tick(){const c=actx();if(!c||c.state!=="running")return;const t=c.currentTime;
    const n=noise(c,0.012),f=c.createBiquadFilter(),g=c.createGain();f.type="highpass";f.frequency.value=3500;
    env(g,t,0.35,0.012);n.connect(f).connect(g).connect(c.destination);n.start(t)},
  /* クリック音 */
  click(){const c=actx();if(!c)return;const t=c.currentTime;
    const n=noise(c,0.03),f=c.createBiquadFilter(),g=c.createGain();f.type="bandpass";f.frequency.value=2200;f.Q.value=1.2;
    env(g,t,0.8,0.03);n.connect(f).connect(g).connect(c.destination);n.start(t);
    const o=c.createOscillator(),og=c.createGain();o.type="triangle";o.frequency.value=1700;env(og,t,0.25,0.025);o.connect(og).connect(c.destination);o.start(t);o.stop(t+0.04)}
};
/* 店舗リストを横にスクロールすると約36pxごとにカリカリ */
(()=>{let last=0;const el=document.getElementById("stores");
  el.addEventListener("scroll",()=>{if(Math.abs(el.scrollLeft-last)>=36){last=el.scrollLeft;SE.tick()}},{passive:true})})();
function chips(el,items,get,set,sound){
  items.forEach(t=>{const b=document.createElement("button");b.className="chip";b.textContent=t;if(CAT[t])b.dataset.c=CAT[t];
    b.onclick=()=>{if(sound)sound();set(get()===t?null:t);render()};el.appendChild(b)});
}
chips($("stores"),STORES,()=>store,v=>store=v,()=>SE.click());
chips($("tags"),TAGS,()=>tag,v=>tag=v);
function render(){
  document.querySelectorAll("#stores .chip").forEach(b=>b.setAttribute("aria-pressed",b.textContent===store));
  document.querySelectorAll("#tags .chip").forEach(b=>b.setAttribute("aria-pressed",b.textContent===tag));
  $("picked").innerHTML=(store?`<span>${store}</span>`:`<span class="ph">店舗を選択</span>`)+(tag?`<span>${tag}</span>`:`<span class="ph">タグなし</span>`);
  $("amount").innerHTML=`<small>¥</small>${yen(total())}`;
  $("calc").textContent=(base&&typed)?`${yen(base)} ＋ ${yen(Number(typed))}`:"";
  $("ok").disabled=!(store&&total()>0);
  renderTotal();
}
/* 累計：タップで 今月→本日→今週→月前半→月後半 */
let mode=0;
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function range(){
  const n=new Date(), y=n.getFullYear(), m=n.getMonth(), M=m+1;
  const last=new Date(y,m+1,0).getDate();
  const ws=new Date(y,m,n.getDate()-n.getDay()), we=new Date(ws);we.setDate(ws.getDate()+6);
  const md=d=>`${d.getMonth()+1}/${d.getDate()}`;
  return [
    {label:`今月（${M}月）`,from:dkey(new Date(y,m,1)),to:dkey(new Date(y,m,last))},
    {label:`本日（${M}/${n.getDate()}）`,from:dkey(n),to:dkey(n)},
    {label:`今週（${md(ws)}〜${md(we)}）`,from:dkey(ws),to:dkey(we)},
    {label:`月前半（${M}/1〜15）`,from:dkey(new Date(y,m,1)),to:dkey(new Date(y,m,15))},
    {label:`月後半（${M}/16〜${last}）`,from:dkey(new Date(y,m,16)),to:dkey(new Date(y,m,last))},
  ][mode];
}
function renderTotal(){
  const r=range(), sum=load().filter(x=>{const d=x.date.slice(0,10);return d>=r.from&&d<=r.to}).reduce((a,x)=>a+x.amount,0);
  $("tLabel").textContent=r.label; $("tVal").textContent=`¥${yen(sum)}`;
}
$("total").onclick=()=>{mode=(mode+1)%5;renderTotal()};
/* 左端：加算ボタン ／ 右：数字キー */
["+100","7","8","9","+500","4","5","6","+1000","1","2","3","+5000","C","0","⌫"].forEach(k=>{
  const b=document.createElement("button");
  if(k[0]==="+"){b.className="add";b.textContent=yen(Number(k.slice(1)));}
  else{b.textContent=k;if(k==="C"||k==="⌫")b.className="fn";}
  b.onclick=()=>{
    if(k[0]==="+"){SE.bash();base+=Number(k.slice(1));}
    else if(k==="C"){base=0;typed="";}
    else if(k==="⌫")typed=typed.slice(0,-1);
    else if(typed.length<7&&!(typed===""&&k==="0"))typed+=k;
    render()};
  $("keys").appendChild(b)});

$("ok").onclick=()=>{
  SE.ok();
  const d=new Date();
  const date=`${dkey(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const r=load();r.unshift({id:Date.now(),date,store,tag:tag||"",amount:total()});save(r);
  toast(`${store} ¥${yen(total())} を記録`);
  store=tag=null;base=0;typed="";render();
};
function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,1600)}
/* 表表示 */
function renderTable(){
  const r=load(),tb=$("tbody");tb.innerHTML="";
  if(!r.length){tb.innerHTML='<tr><td colspan="5" class="empty">まだ記録はありません</td></tr>';return}
  r.forEach(x=>{const tr=document.createElement("tr");
    const [,mm,dd]=x.date.slice(0,10).split("-");
    tr.innerHTML=`<td>${Number(mm)}/${Number(dd)}</td><td>${x.store}</td><td>${x.tag}</td><td class="num">¥${yen(x.amount)}</td><td></td>`;
    const b=document.createElement("button");b.className="del";b.textContent="×";b.setAttribute("aria-label","削除");
    b.onclick=()=>{if(b.classList.contains("c")){save(load().filter(y=>y.id!==x.id));renderTable();renderTotal()}else{b.classList.add("c");b.textContent="削除"}};
    tr.lastChild.appendChild(b);tb.appendChild(tr)});
}
$("switch").onclick=()=>{
  const toTable=$("tableView").hidden;
  $("tableView").hidden=!toTable; $("inputView").hidden=toTable;
  $("switch").textContent=toTable?"入力":"表";
  if(toTable)renderTable();
};
render();
</script>
</body>
</html>
